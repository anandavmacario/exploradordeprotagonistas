<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Explorador de protagonistas de Resident Evil 🧟</h1>
        <p class="subtitle">Consumindo minha própria API em Node.js</p>

        <div class="protagonista-area">
            <img src="" alt="Resident Evil" id="protagonistaImage">
            <div id="protagonistaName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Protagonista Aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="breedInput"
                placeholder="Digite um protagonista (ex: Claire, Leon)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
